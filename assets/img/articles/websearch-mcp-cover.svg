<svg viewBox="0 0 1200 600" width="1200" height="600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
            <stop offset="30%" style="stop-color:#1a1838;stop-opacity:1" />
            <stop offset="60%" style="stop-color:#2d1b4e;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#1a0f3a;stop-opacity:1" />
        </linearGradient>
        
        <radialGradient id="glow1" cx="70%" cy="20%">
            <stop offset="0%" style="stop-color:#a3ff12;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#a3ff12;stop-opacity:0" />
        </radialGradient>
        
        <radialGradient id="glow2" cx="20%" cy="80%">
            <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.3" />
            <stop offset="100%" style="stop-color:#667eea;stop-opacity:0" />
        </radialGradient>
        
        <!-- Blur filter -->
        <filter id="blur">
            <feGaussianBlur in="SourceGraphic" stdDeviation="3" />
        </filter>
        
        <!-- Glow effect -->
        <filter id="glowEffect">
            <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Background -->
    <rect width="1200" height="600" fill="url(#bgGradient)"/>
    
    <!-- Ambient glows -->
    <circle cx="900" cy="100" r="300" fill="url(#glow1)"/>
    <circle cx="200" cy="500" r="250" fill="url(#glow2)"/>
    
    <!-- Decorative elements - top right -->
    <g opacity="0.1">
        <path d="M 1000 50 L 1100 100 L 1000 150 L 950 100 Z" stroke="#a3ff12" stroke-width="2" fill="none"/>
        <circle cx="1050" cy="100" r="40" stroke="#a3ff12" stroke-width="2" fill="none"/>
    </g>
    
    <!-- Decorative elements - bottom left -->
    <g opacity="0.1">
        <rect x="50" y="450" width="60" height="60" stroke="#667eea" stroke-width="2" fill="none"/>
        <line x1="50" y1="450" x2="110" y2="510" stroke="#667eea" stroke-width="2"/>
        <line x1="110" y1="450" x2="50" y2="510" stroke="#667eea" stroke-width="2"/>
    </g>
    
    <!-- Central content -->
    <g>
        <!-- Rocket icon with glow -->
        <g transform="translate(600, 150)">
            <text x="0" y="0" font-size="120" text-anchor="middle" dominant-baseline="middle" filter="url(#glowEffect)">🚀</text>
        </g>
        
        <!-- Main title -->
        <text x="600" y="280" font-size="58" font-weight="700" text-anchor="middle" fill="#a3ff12" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="1">
            Web Search MCP
        </text>
        
        <!-- Subtitle -->
        <text x="600" y="340" font-size="26" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
            L'Arme Secrète des Webmarketeurs
        </text>
        
        <!-- Tagline -->
        <text x="600" y="385" font-size="16" text-anchor="middle" fill="rgba(163,255,18,0.8)" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" letter-spacing="0.5">
            Restez connecté aux tendances en temps réel
        </text>
    </g>
    
    <!-- Bottom elements -->
    <g transform="translate(0, 500)">
        <!-- Element 1 - Tendances -->
        <g transform="translate(150, 50)">
            <circle cx="0" cy="0" r="35" fill="rgba(163,255,18,0.1)" stroke="rgba(163,255,18,0.3)" stroke-width="2"/>
            <text x="0" y="-5" font-size="28" text-anchor="middle" dominant-baseline="middle">🎯</text>
            <text x="0" y="25" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif">Tendances</text>
        </g>
        
        <!-- Element 2 - SEO -->
        <g transform="translate(350, 50)">
            <circle cx="0" cy="0" r="35" fill="rgba(163,255,18,0.1)" stroke="rgba(163,255,18,0.3)" stroke-width="2"/>
            <text x="0" y="-5" font-size="28" text-anchor="middle" dominant-baseline="middle">🔍</text>
            <text x="0" y="25" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif">SEO</text>
        </g>
        
        <!-- Element 3 - Technos -->
        <g transform="translate(550, 50)">
            <circle cx="0" cy="0" r="35" fill="rgba(163,255,18,0.1)" stroke="rgba(163,255,18,0.3)" stroke-width="2"/>
            <text x="0" y="-5" font-size="28" text-anchor="middle" dominant-baseline="middle">💻</text>
            <text x="0" y="25" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif">Technos</text>
        </g>
        
        <!-- Element 4 - Marketing -->
        <g transform="translate(750, 50)">
            <circle cx="0" cy="0" r="35" fill="rgba(163,255,18,0.1)" stroke="rgba(163,255,18,0.3)" stroke-width="2"/>
            <text x="0" y="-5" font-size="28" text-anchor="middle" dominant-baseline="middle">📊</text>
            <text x="0" y="25" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif">Marketing</text>
        </g>
        
        <!-- Element 5 - Automation -->
        <g transform="translate(950, 50)">
            <circle cx="0" cy="0" r="35" fill="rgba(163,255,18,0.1)" stroke="rgba(163,255,18,0.3)" stroke-width="2"/>
            <text x="0" y="-5" font-size="28" text-anchor="middle" dominant-baseline="middle">⚙️</text>
            <text x="0" y="25" font-size="12" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="'Space Grotesk', sans-serif">Automation</text>
        </g>
    </g>
    
    <!-- Decorative lines -->
    <line x1="200" y1="50" x2="1000" y2="50" stroke="rgba(163,255,18,0.2)" stroke-width="2" opacity="0.3"/>
    <line x1="200" y1="420" x2="1000" y2="420" stroke="rgba(163,255,18,0.2)" stroke-width="2" opacity="0.3"/>
</svg>
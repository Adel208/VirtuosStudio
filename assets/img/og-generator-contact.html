<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OG Image - Contact - Virtuos Studio</title>
  <style>
    body { margin: 0; padding: 0; font-family: 'Arial', sans-serif; }
    
    .og-image {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #000000 0%, #1a1a1a 50%, #000000 100%);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: white;
      padding: 60px;
      box-sizing: border-box;
    }
    
    .og-image::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(ellipse at center left, rgba(163,255,18,0.15) 0%, transparent 70%);
    }
    
    .left-content {
      flex: 1;
      z-index: 2;
      max-width: 600px;
    }
    
    .right-content {
      flex: 1;
      text-align: center;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #A3FF12, #7DD3FC);
      margin-bottom: 25px;
      clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
    }
    
    .title {
      font-size: 56px;
      font-weight: 900;
      margin: 0 0 20px;
      background: linear-gradient(135deg, #A3FF12, #7DD3FC);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.1;
    }
    
    .subtitle {
      font-size: 24px;
      color: #ffffff;
      margin: 0 0 30px;
      font-weight: 300;
      opacity: 0.9;
    }
    
    .features {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 20px;
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 15px;
      font-size: 18px;
      font-weight: 500;
    }
    
    .feature-icon {
      width: 24px;
      height: 24px;
      background: #A3FF12;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: bold;
      font-size: 14px;
    }
    
    .contact-card {
      background: rgba(255,255,255,0.1);
      padding: 40px;
      border-radius: 20px;
      border: 2px solid rgba(163,255,18,0.3);
      backdrop-filter: blur(10px);
      text-align: center;
      max-width: 400px;
    }
    
    .contact-title {
      font-size: 32px;
      font-weight: 700;
      margin: 0 0 20px;
      color: #A3FF12;
    }
    
    .contact-info {
      font-size: 18px;
      margin: 15px 0;
      opacity: 0.9;
    }
    
    .cta-badge {
      background: linear-gradient(135deg, #A3FF12, #7DD3FC);
      color: #000;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 700;
      font-size: 16px;
      margin-top: 20px;
      display: inline-block;
    }
    
    .bottom-text {
      position: absolute;
      bottom: 25px;
      left: 60px;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>
  <div class="og-image">
    <div class="left-content">
      <div class="logo"></div>
      <h1 class="title">CONTACT</h1>
      <p class="subtitle">Parlons de votre projet</p>
      
      <div class="features">
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Devis gratuit sous 24h</span>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Consultation personnalisée</span>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Réponse rapide garantie</span>
        </div>
      </div>
    </div>
    
    <div class="right-content">
      <div class="contact-card">
        <h2 class="contact-title">Virtuos Studio</h2>
        <div class="contact-info">📧 virtuosagency@gmail.com</div>
        <div class="contact-info">📱 +33 7 81 45 19 66</div>
        <div class="cta-badge">Obtenir un devis</div>
      </div>
    </div>
    
    <div class="bottom-text">Virtuos Studio • Agence Web Premium</div>
  </div>
</body>
</html>

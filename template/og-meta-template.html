<!-- Template Open Graph à copier dans vos pages -->
<!-- Remplacez les variables [PAGE_*] par les valeurs appropriées -->

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:url" content="https://adel208.github.io/VirtuosStudio/[PAGE_URL]" />
<meta property="og:title" content="[PAGE_TITLE] - Virtuos Studio" />
<meta property="og:description" content="[PAGE_DESCRIPTION]" />
<meta property="og:image" content="https://adel208.github.io/VirtuosStudio/assets/img/[PAGE_OG_IMAGE]" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="[PAGE_IMAGE_ALT]" />
<meta property="og:site_name" content="Virtuos Studio" />
<meta property="og:locale" content="fr_FR" />

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" content="https://adel208.github.io/VirtuosStudio/[PAGE_URL]" />
<meta name="twitter:title" content="[PAGE_TITLE] - Virtuos Studio" />
<meta name="twitter:description" content="[PAGE_DESCRIPTION]" />
<meta name="twitter:image" content="https://adel208.github.io/VirtuosStudio/assets/img/[PAGE_OG_IMAGE]" />
<meta name="twitter:image:alt" content="[PAGE_IMAGE_ALT]" />
<meta name="twitter:creator" content="@VirtuosStudio" />
<meta name="twitter:site" content="@VirtuosStudio" />

<!-- LinkedIn -->
<meta property="og:image:type" content="image/jpeg" />

<!-- WhatsApp -->
<meta property="og:image:secure_url" content="https://adel208.github.io/VirtuosStudio/assets/img/[PAGE_OG_IMAGE]" />

<!-- 
VARIABLES À REMPLACER :

[PAGE_URL] = URL relative de la page (ex: "template/contact.html")
[PAGE_TITLE] = Titre spécifique à la page (ex: "Contact | Devis Gratuit")
[PAGE_DESCRIPTION] = Description optimisée pour les réseaux sociaux (155 caractères max)
[PAGE_OG_IMAGE] = Nom de l'image Open Graph (ex: "og-image-contact.jpg")
[PAGE_IMAGE_ALT] = Texte alternatif de l'image

EXEMPLES D'IMAGES OPEN GRAPH À CRÉER :
- og-image.jpg (page d'accueil)
- og-image-contact.jpg (page contact)
- og-image-tarifs.jpg (page tarifs)
- og-image-projets.jpg (page projets)
- og-image-faq.jpg (page FAQ)

DIMENSIONS REQUISES :
- Facebook/LinkedIn : 1200x630px
- Twitter : 1200x630px (summary_large_image)
- WhatsApp : 1200x630px

BONNES PRATIQUES :
1. Titre : 60 caractères max
2. Description : 155 caractères max pour Facebook, 125 pour Twitter
3. Image : format JPG ou PNG, moins de 8MB
4. Texte sur l'image : lisible même en petit format
5. Cohérence visuelle avec votre charte graphique
-->
